# Same-origin read-only proxy for the two Prometheus HTTP API endpoints
# the metrics client needs. Only GET is allowed; only /query and
# /query_range are forwarded (to /api/v1/query[_range]); anything else
# under this prefix is a 404. `resolver` + a variable in `proxy_pass`
# defer DNS resolution of the upstream to request time, so nginx still
# starts and serves the rest of the site even when the Prometheus
# package isn't installed or its name doesn't resolve yet — a failed
# lookup then surfaces as a 502 on this location only, not a boot crash.
location /metrics-api/ {
    limit_except GET { deny all; }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $prom http://prometheus.my.ava.do:9090;

    rewrite ^/metrics-api/(query|query_range)$ /api/v1/$1 break;
    if ($uri !~ ^/api/v1/(query|query_range)$) {
        return 404;
    }

    proxy_pass $prom;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

# Same-origin read-only proxy for the Priority Care package's status
# (care.avado.dnp.dappnode.eth), so the Priority page can show "AVADO
# is watching your box" without CORS and also through Remote Connect
# or an IP-address URL. Only GET /care-api/status is forwarded, to
# /api/status; the Host header sent upstream is care.my.ava.do (the
# package's Host allow-list). Resolution is deferred like above, so a
# box without the package only gets a 502 here.
location = /care-api/status {
    limit_except GET { deny all; }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $care http://care.my.ava.do;

    rewrite ^ /api/status break;

    proxy_pass $care;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
}

# WAMP websocket on the Admin's own address. A page on the secure address
# (https://admin.my.ava.do) may not open ws://wamp.my.ava.do:8080, so it
# connects to wss://admin.my.ava.do/ws, forwarded here to the same WAMP the
# http page uses directly. Nothing else is reachable through it.
location = /ws {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $wamp http://wamp.my.ava.do:8080;

    proxy_pass $wamp;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host wamp.my.ava.do:8080;
    proxy_connect_timeout 5s;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}

# The box's IPFS gateway (store manifests, app icons) for the secure address.
# GET only, /ipfs/<hash> paths only.
location /ipfs/ {
    limit_except GET { deny all; }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ipfsgw http://ipfs.my.ava.do:8080;

    proxy_pass $ipfsgw;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# The one IPFS API call the store page makes (connect to the AVADO store
# peers), for the secure address. POST /api/v0/swarm/connect?arg=... only.
# Origin/Referer are dropped: the IPFS API refuses a browser origin it does
# not know, and this request comes from the Admin itself.
location = /ipfs-api/swarm/connect {
    limit_except POST { deny all; }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ipfsapi http://ipfs.my.ava.do:5001;

    rewrite ^ /api/v0/swarm/connect break;
    proxy_set_header Origin "";
    proxy_set_header Referer "";

    proxy_pass $ipfsapi;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# Installable Admin (PWA). The service worker and the page that loads it are
# always checked with the server, so an Admin update reaches the phone on
# its next start. sw.js never caches the box's data (see its header).
location = /sw.js {
    root   /usr/www/adminui;
    add_header Cache-Control "no-cache" always;
}

location = /manifest.webmanifest {
    root   /usr/www/adminui;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}

location = /index.html {
    root   /usr/www/adminui;
    add_header Cache-Control "no-cache" always;
}

location / {
    root   /usr/www/adminui;
    index  index.html index.htm;
}
