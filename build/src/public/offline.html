<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>AVADO is not reachable</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #1d2433; --muted: #5b6475; --accent: #2db3a8; }
    @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --fg: #e8ebf0; --muted: #a3abb8; } }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 360px; padding: 24px 16px; text-align: center; }
    h1 { font-size: 1.25rem; margin: 16px 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    button { min-height: 44px; width: 100%; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Your AVADO is not reachable</h1>
    <p>Connect this phone to your AVADO's Wi-Fi or VPN, then try again. Alerts still reach you without it.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
